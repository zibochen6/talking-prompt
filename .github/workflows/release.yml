name: Build and release macOS app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:desktop
      - run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches app version
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum *.dmg > SHA256SUMS.txt
          notes=$(awk 'BEGIN{p=0} /^## /{p++; if(p>1) exit} p==1 && !/^## /{print}' "$GITHUB_WORKSPACE/CHANGELOG.md")
          reminder="下载适合你的 Mac 芯片的 DMG（arm64 为 Apple 芯片，x64 为 Intel）。安装包暂未签名或公证，首次打开可能需要在系统设置中允许。更新请下载并手动安装；文稿保留在本机应用数据目录。"
          if [ -z "$notes" ]; then
            notes="$reminder"
          else
            notes="${notes}"$'\n\n'"${reminder}"
          fi
          gh release create "$GITHUB_REF_NAME" ./*.dmg ./SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "同频 $GITHUB_REF_NAME" --notes "$notes"
