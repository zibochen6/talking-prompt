name: Build and release macOS app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:desktop
      # macos-15 runners are arm64. `npm install --os darwin --cpu x64` still
      # rejects a directly requested package with EBADPLATFORM, because that
      # check ignores the override. `npm pack` downloads the tarball anyway.
      # `--force` is not used: it would also install every other optional
      # native package in the tree. prepare-voice-runtime then keeps only
      # sherpa-onnx-darwin-$SHERPA_ARCH for the DMG.
      - name: Install the recognizer for this Mac chip
        env:
          SHERPA_ARCH: ${{ matrix.arch }}
        run: |
          package="sherpa-onnx-darwin-${SHERPA_ARCH}"
          tarball="$(npm pack "${package}@2.0.1" --silent --pack-destination "${RUNNER_TEMP}")"
          destination="node_modules/${package}"
          rm -rf "${destination}"
          mkdir -p "${destination}"
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${destination}" --strip-components=1
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const arch = process.env.SHERPA_ARCH;
            const pkg = JSON.parse(readFileSync(`node_modules/sherpa-onnx-darwin-${arch}/package.json`, "utf8"));
            if (!pkg.os?.includes("darwin") || !pkg.cpu?.includes(arch)) {
              throw new Error(`recognizer package does not match darwin ${arch}`);
            }
          '
      - run: node scripts/fetch-voice-model.mjs
      - run: node scripts/prepare-voice-runtime.mjs
        env:
          PROMPT_SHERPA_ARCH: ${{ matrix.arch }}
      - run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches app version
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum *.dmg > SHA256SUMS.txt
          notes=$(awk 'BEGIN{p=0} /^## /{p++; if(p>1) exit} p==1 && !/^## /{print}' "$GITHUB_WORKSPACE/CHANGELOG.md")
          reminder="下载适合你的 Mac 芯片的 DMG（arm64 为 Apple 芯片，x64 为 Intel）。安装包暂未签名或公证，首次打开可能需要在系统设置中允许。更新请下载并手动安装；文稿保留在本机应用数据目录。"
          if [ -z "$notes" ]; then
            notes="$reminder"
          else
            notes="${notes}"$'\n\n'"${reminder}"
          fi
          gh release create "$GITHUB_REF_NAME" ./*.dmg ./SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "同频 $GITHUB_REF_NAME" --notes "$notes"
